<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,900;1,500;1,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2b3a;
    --ink-soft: #5c5445;
    --paper: #f7f2e6;
    --paper-alt: #efe4cd;
    --brass: #b8863b;
    --brass-dark: #8f6526;
    --brick: #a1432f;
    --sea: #3f6e64;
    --rule: #ddccaa;
    --white: #fffdf8;
    --mp-red: #c8102e;
    --mp-gold: #ffcc00;
    /* The full-screen photo/video viewer stays dark (photos read best
       against black), but borrows this same brass/paper vocabulary --
       "brass fittings on dark leather" -- instead of a generic blue-tech
       accent, so it still reads as part of the journal rather than a
       different app. */
    --viewer-bg: rgba(10,9,7,.97);
    --viewer-text: #f7f2e6;
    --viewer-muted: #cbb98f;
    --viewer-accent: #dba84e;
    --viewer-chrome: rgba(216,177,111,.10);
    --viewer-chrome-hover: rgba(216,177,111,.20);
    --viewer-border: rgba(216,177,111,.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: linear-gradient(180deg, var(--paper-alt) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--rule);
  }
  header h1 {
    grid-column: 2;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 20px; margin: 0;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-left {
    grid-column: 1; justify-self: start;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--brass-dark);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .back-link:hover { color: var(--sea); text-decoration: underline; }
  .day-nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .day-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--brass-dark);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  a.day-nav-link:hover { color: var(--sea); text-decoration: underline; }
  .day-nav-link.disabled {
    opacity: .45;
    cursor: default;
  }
  .day-nav-link .day-nav-icon { font-size: 14px; line-height: 1; }
  .header-right {
    grid-column: 3; justify-self: end;
    display: flex; align-items: center; gap: 10px;
    /* Pre-existing narrow-viewport bug, fixed 2026-08-29: this row (count,
       both selects, Slideshow, All Days) never wrapped, so its ~535px
       natural width forced the whole page wider than any phone-width
       viewport once the header's own grid-template-columns switches to
       "auto 1fr auto" at the 620px breakpoint below (an "auto" grid track
       sizes to fit its content, and a non-wrapping flex row's min-content
       width is the sum of every child, not just the widest one). flex-wrap
       lets it break onto more than one line instead; justify-content
       keeps each wrapped line hugging the right edge, matching this
       column's own justify-self: end placement (.header-left, its
       opposite-aligned sibling, already wraps today -- see its own
       flex-wrap: wrap above -- this just brings header-right in line
       with it). */
    flex-wrap: wrap; justify-content: flex-end;
  }
  .count {
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  button, .file-btn {
    background: var(--brass);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background-color .15s ease;
  }
  button:hover, .file-btn:hover { background: var(--brass-dark); }

  select {
    background: var(--white);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
  }

  #day-picker { padding: 30px 20px 60px; max-width: 700px; margin: 0 auto; }
  .day-picker-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .day-picker-toolbar h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    margin: 0;
  }
  .day-picker-toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  /* One block per day, oldest-first by default: a title/count link row
     (the "daily link") above a grid of that day's own thumbnails, with a
     border-bottom on the block itself acting as the separator between
     days -- so the whole trip still reads top-to-bottom like a table of
     contents, just with a visual preview of each day's photos/videos. */
  .day-list {
    display: flex;
    flex-direction: column;
  }
  .day-block {
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }
  .day-block:first-child { padding-top: 0; }
  .day-block:last-child { border-bottom: none; padding-bottom: 0; }
  .day-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 12px;
  }
  .day-card:hover .day-card-title { color: var(--sea); }
  .day-card .day-card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15.5px; }
  .day-card .day-card-count {
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .day-thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
  }
  .day-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--paper-alt);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--rule);
    display: block;
  }
  .day-thumb:hover { border-color: var(--brass); }
  .day-thumb img, .day-thumb video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .day-thumb .video-badge {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    pointer-events: none;
  }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    height: 60vh;
    color: var(--ink-soft);
    padding: 20px;
  }
  #empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    margin-bottom: 6px;
  }
  #empty-state p { max-width: 420px; line-height: 1.5; font-size: 14px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    padding: 16px 20px 60px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--paper-alt);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--rule);
    box-shadow: 0 2px 10px rgba(28,43,58,0.06);
  }
  .thumb img, .thumb video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .2s ease;
  }
  .thumb:hover img, .thumb:hover video { transform: scale(1.05); }
  .thumb .video-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .thumb .name {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 6px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb .name .thumb-date { display: block; color: #e8d9b8; font-size: 9.5px; }

  #viewer {
    position: fixed; inset: 0;
    background: var(--viewer-bg);
    display: none;
    z-index: 100;
  }
  #viewer.open {
    display: grid;
    grid-template-columns: 10% 80% 10%;
    height: 100%;
  }

  /* Left/right 10% panels: a fixed item at the top (count / close), and
     first+previous or next+last nav buttons vertically centered below —
     same relative top/middle positions the old single-row layout used. */
  .viewer-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 18px 6px;
  }
  .viewer-side-top {
    flex: none;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
  }
  .viewer-side-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .viewer-count {
    color: var(--viewer-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
  }

  .icon-btn {
    background: var(--viewer-chrome);
    border: 1px solid var(--viewer-border);
    color: var(--viewer-text);
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { background: var(--viewer-chrome-hover); }

  .nav-btn {
    flex: none;
    background: var(--viewer-chrome);
    border: 1px solid var(--viewer-border);
    color: var(--viewer-text);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--viewer-chrome-hover); }
  .nav-btn:disabled { opacity: .35; cursor: default; }

  /* Center 80% column: description block, then the "Next Day" link (top-
     aligned, above the image), then the image itself, then zoom controls,
     then the filename block -- the image stage is the only flexible
     ("1fr") row, so it is always sized to whatever room is left over
     after the other four blocks, never the other way around. */
  .viewer-center {
    display: grid;
    grid-template-rows: auto auto 1fr auto auto;
    gap: 10px;
    height: 100%;
    min-width: 0;
    padding: 0 10px 18px;
    overflow-y: auto;
  }

  .desc-block {
    width: 100%;
    margin: 0;
    background: transparent;
    border-radius: 10px;
    padding: 12px 16px;
    line-height: 1.55;
    font-size: 14px;
    font-family: 'Public Sans', sans-serif;
    color: var(--viewer-text);
    text-align: center;
  }
  .desc-block .desc-label-inline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--viewer-accent); font-weight: 700;
  }
  .desc-block .desc-alt-link {
    margin-left: 8px;
    color: var(--viewer-accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .desc-block .desc-alt-link:hover { text-decoration: underline; }
  .desc-block.monty {
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    background:
      repeating-linear-gradient(45deg, rgba(200,16,46,.22), rgba(200,16,46,.22) 10px, rgba(255,204,0,.22) 10px, rgba(255,204,0,.22) 20px);
    color: #fff3cd;
    text-shadow: 1px 1px 0 rgba(0,0,0,.6);
    font-size: 15px;
  }
  .desc-block.monty .desc-label-inline { color: var(--mp-gold); text-shadow: 1px 1px 0 rgba(0,0,0,.6); }
  .desc-block.monty .desc-alt-link { color: var(--mp-gold); }

  #stage {
    min-height: 0;
    overflow: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: #000;
  }
  /* Centered flex content can not be scrolled into on its top/left side in
     any browser -- a well-known CSS limitation, not a bug in this page --
     so once zoomed in past 100% #stage switches to top/left anchoring,
     which keeps the whole enlarged image reachable by scrolling. */
  #stage.zoomed {
    align-items: flex-start; justify-content: flex-start;
  }
  #stage img, #stage video {
    display: block;
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transition: transform .1s ease;
    transform-origin: 0 0;
  }

  .zoom-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    flex-wrap: wrap; row-gap: 8px;
  }
  .zoom-bar button {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--viewer-chrome);
    border: 1px solid var(--viewer-border);
    color: var(--viewer-text); font-size: 15px; padding: 0;
  }
  .zoom-bar button:hover { background: var(--viewer-chrome-hover); }
  #zoom-level {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--viewer-muted); min-width: 42px; text-align: center;
  }
  /* Divider between the zoom-control group (-, level, +, Reset) and the
     fullscreen/slideshow group added to their right -- a plain vertical
     rule, sized to the row's own height rather than stretched, so it reads
     as a separator between feature groups rather than another control. */
  .zoom-bar-sep {
    width: 1px;
    height: 24px;
    background: var(--viewer-border);
  }
  /* ".zoom-bar button" above (width/height/border-radius:50%, sized for
     the -/+ glyphs) outranks a bare ".zoom-bar-btn" class selector on
     specificity alone, so this has to repeat the "button" type to win the
     override -- otherwise Full Screen/Slideshow silently render as clipped
     32px circles instead of the pill shape below. */
  .zoom-bar button.zoom-bar-btn {
    width: auto; height: auto; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--viewer-chrome);
    border: 1px solid var(--viewer-border);
    color: var(--viewer-text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
    padding: 7px 12px;
    white-space: nowrap;
  }
  .zoom-bar button.zoom-bar-btn:hover { background: var(--viewer-chrome-hover); }
  .zoom-bar-select {
    background: var(--viewer-chrome);
    color: var(--viewer-text);
    border: 1px solid var(--viewer-border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .filename-block {
    text-align: center;
    color: var(--viewer-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  .filename-block .data-link {
    margin-left: 10px;
    color: var(--viewer-accent);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .filename-block .data-link:hover { text-decoration: underline; }
  /* Shown only on the last item of a day's own gallery, when a later day
     exists -- lets a visitor keep going straight into the next day's
     photos instead of backing out to the day picker first. */
  .next-day-row { text-align: center; }
  .next-day-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--viewer-accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--viewer-border);
    border-radius: 8px;
    padding: 6px 12px;
  }
  .next-day-link:hover { background: var(--viewer-chrome); }

  .modal {
    position: fixed; inset: 0;
    background: rgba(28,20,10,.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: 10px;
    max-width: 720px; width: 100%;
    max-height: 80vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(28,43,58,0.18);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: var(--paper-alt);
    border-bottom: 1px solid var(--rule);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink);
    font-weight: 600; font-size: 12.5px;
  }
  .modal-header .icon-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
  }
  .modal-header .icon-btn:hover { background: var(--paper); color: var(--ink); }
  #data-json {
    margin: 0; padding: 16px;
    overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.5;
    color: var(--ink-soft);
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---- Edit Mode: toggle, pending-changes cluster, per-thumb overlay
     controls, and the edit modal's own form styling. Added 2026-09-02. ---- */
  .edit-mode-btn.active { background: var(--brick); }
  .edit-mode-btn.active:hover { background: #8a3624; }
  .pending-changes { display: inline-flex; align-items: center; gap: 8px; }
  .pending-count {
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .pending-btn { padding: 8px 12px; }
  .pending-clear-btn { background: var(--ink-soft); }
  .pending-clear-btn:hover { background: var(--ink); }

  .thumb-edit-controls {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    display: flex; gap: 5px;
  }
  .thumb-edit-btn {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(20,16,10,.72);
    color: #fff;
    border: 1px solid rgba(255,255,255,.45);
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .thumb-edit-btn:hover { background: rgba(20,16,10,.9); }
  .thumb-edit-btn.remove { background: rgba(161,67,47,.82); }
  .thumb-edit-btn.remove:hover { background: rgba(161,67,47,1); }

  .day-thumb-edit-controls {
    position: absolute; top: 3px; right: 3px; z-index: 2;
    display: flex; gap: 3px;
  }
  .day-thumb-edit-controls .thumb-edit-btn { width: 18px; height: 18px; font-size: 9px; }

  .pending-move-badge {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(184,134,59,.88);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    text-align: center;
    padding: 2px 3px;
    pointer-events: none;
  }

  .filename-block #viewer-edit-controls { margin-left: 10px; }
  .filename-block .remove-link { color: var(--mp-red); }

  .edit-modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .edit-field { display: flex; flex-direction: column; gap: 5px; }
  .edit-field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .edit-field textarea, .edit-field input[type="text"] {
    font-family: 'Public Sans', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink);
    resize: vertical;
  }
  .edit-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .edit-cancel-btn { background: var(--ink-soft); }
  .edit-cancel-btn:hover { background: var(--ink); }

  @media (max-width: 620px) {
    /* Was `grid-template-columns: auto 1fr auto;` -- two side "auto"
       columns competing for the same row. An "auto" grid track's minimum
       size is its content's own natural width (max-content after any
       internal flex-wrap), and CSS Grid does not shrink an "auto" track
       below that just because the container is narrow -- so once
       header-left's day-nav (First/Previous/Next/Last, ~250px on one
       line) and header-right's own content (still ~145px even after
       header-right's own flex-wrap, below, since its WIDEST single
       child still has to fit somewhere) together needed more room than a
       phone-width viewport had, the header simply overflowed the page
       horizontally -- confirmed via Playwright at 320-420px before this
       fix (pre-existing, unrelated to the two updates above it in this
       file's history). Stacking all three sections into their own

<script>
  // This page lives in common/, a sibling of every travel-journal-*
  // folder. ?trip=<folder-name> (e.g. "travel-journal-2026-07-01")
  // says which one to load; TRIP_BASE is the relative-path prefix
  // every trip-relative asset below (catalog data, photo/video files)
  // is built from -- NOT the "Journal" back-link, which points at
  // common/journal.html?trip=<TRIP> instead, a sibling file in this
  // same folder (see backLink below). With no ?trip= given, TRIP_BASE
  // falls back to "./" (this page's own folder), which will simply
  // find nothing -- see the "No multimedia files found" empty state
  // below.
  var TRIP = new URLSearchParams(window.location.search).get("trip") || "";
  var TRIP_BASE = TRIP ? "../" + TRIP + "/" : "./";
  document.write(
    '<script src="' + TRIP_BASE + 'data/multimedia/multimedia-data.js" ' +
    'onerror="window.MULTIMEDIA_CATALOG = window.MULTIMEDIA_CATALOG || []">' +
    '<' + '/script>'
  );
</script>

<script>
(function () {
  // ---- Runtime data resolution --------------------------------------------
  // Everything below reads the RAW catalog (window.MULTIMEDIA_CATALOG, an
  // unsorted, ungrouped array mirroring data/multimedia/multimedia-data.json
  // exactly) and resolves it live, every time this page loads: grouping by
  // day/folder, parsing capture dates, building file URLs, and picking
  // which description text exists. None of this is precomputed at build
  // time, so the page always reflects whatever the catalog currently says
  // without regenerating this HTML file.

  // EXIF datetime_original looks like "2026:07:10 15:28:06" — the first two
  // colons are date separators, not time separators, so a plain Date.parse
  // will not understand it without first rewriting it to ISO-8601.
  var EXIF_DT_RE = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/;
  function parseExifDateTime(raw) {
    if (!raw) return null;
    var m = EXIF_DT_RE.exec(raw);
    if (!m) return null;
    var iso = m[1] + "-" + m[2] + "-" + m[3] + "T" + m[4] + ":" + m[5] + ":" + m[6];
    var ms = Date.parse(iso);
    return isNaN(ms) ? null : ms;
  }

  // Sort by metadata datetime_original ascending by default, falling back
  // to the file's own recorded date (file_properties.modified_time — the
  // only per-file timestamp this catalog tracks) when datetime_original is
  // missing or unparseable.
  function resolveDate(entry) {
    var exifRaw = entry.multimedia_metadata && entry.multimedia_metadata.datetime_original;
    var exifMs = parseExifDateTime(exifRaw);
    if (exifMs !== null) return { source: "exif", ms: exifMs };

    var modRaw = entry.file_properties && entry.file_properties.modified_time;
    var modMs = modRaw ? Date.parse(modRaw) : NaN;
    if (!isNaN(modMs)) return { source: "file_modified", ms: modMs };

    return { source: "none", ms: null };
  }

  // Build a file's URL relative to this page, matching how gallery.html
  // builds photo URLs from manifest.js — encode each path segment
  // separately so folder/file names with spaces or punctuation still
  // resolve.
  function buildUrl(relativeFolder, fileName) {
    var folderPart = relativeFolder.split("/").map(encodeURIComponent).join("/");
    return TRIP_BASE + folderPart + "/" + encodeURIComponent(fileName);
  }

  // Builds a link back to this same shared page, always carrying the
  // current trip along (?trip=...) plus whichever of folder/photo
  // are given -- the one place that assembles every internal
  // daily-gallery.html?... link below, so the trip never gets dropped.
  function dailyGalleryUrl(params) {
    var qs = [];
    if (TRIP) qs.push("trip=" + encodeURIComponent(TRIP));
    if (params && params.folder != null) qs.push("folder=" + encodeURIComponent(params.folder));
    if (params && params.photo != null) qs.push("photo=" + encodeURIComponent(params.photo));
    return "./daily-gallery.html" + (qs.length ? "?" + qs.join("&") : "");
  }

  // relative_folder is like "photos/2026-07-10" — group (and title) by its
  // last path segment, so a future non-dated folder (e.g. "photos-unsorted")
  // groups and titles correctly too, not just dated ones.
  function basename(relativeFolder) {
    var parts = relativeFolder.split("/");
    return parts[parts.length - 1];
  }

  // ---- Edit Mode: local pending-changes queue --------------------------
  // This page is fully static/client-side and cannot write to disk itself,
  // so "Edit" and "Remove" don't touch anything on disk directly. Instead
  // they queue changes in this browser (localStorage, keyed per trip) and
  // apply them OPTIMISTICALLY to what's rendered here, while leaving the
  // real files/catalog untouched until the queued changes are downloaded
  // and run through build-multimedia-data.py's --apply-descriptions and
  // --remove-files (see that script's own "EDIT MODE" docs). A queued
  // description edit is safe to show immediately (it's just text); a
  // queued day-folder move is NOT reflected in the item's grouping/URL
  // here (the file hasn't actually moved on disk yet) -- it only shows as
  // a small "-> YYYY-MM-DD" badge until the real move has happened and
  // this page is reloaded from a freshly rebuilt catalog.
  var EDIT_MODE_KEY = "dailyGalleryEditMode:" + TRIP;
  var PENDING_KEY = "dailyGalleryPendingChanges:" + TRIP;

  function loadEditMode() {
    try { return window.localStorage.getItem(EDIT_MODE_KEY) === "1"; }
    catch (e) { return false; }
  }
  function saveEditMode(on) {
    try { window.localStorage.setItem(EDIT_MODE_KEY, on ? "1" : "0"); }
    catch (e) { /* localStorage unavailable (private mode, etc.) -- edit mode just won't stick across reloads */ }
  }
  function loadPending() {
    try {
      var raw = window.localStorage.getItem(PENDING_KEY);
      if (!raw) return { edits: {}, removals: {} };
      var parsed = JSON.parse(raw);
      return { edits: parsed.edits || {}, removals: parsed.removals || {} };
    } catch (e) { return { edits: {}, removals: {} }; }
  }
  function savePending() {
    try { window.localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); }
    catch (e) { /* best-effort; a full/blocked localStorage just won't persist the queue */ }
  }
  // relative_folder + file_name is a file's real, on-disk identity -- the
  // one build-multimedia-data.py matches against -- so every pending
  // edit/removal is keyed by that pair, never by anything that might
  // itself be queued for change (like a pending move's destination day).
  function pendingKey(relFolder, fileName) {
    return encodeURIComponent(relFolder) + "::" + encodeURIComponent(fileName);
  }

  var editMode = loadEditMode();
  var pending = loadPending();

  function buildGroups(rawCatalog) {
    var out = {};
    for (var i = 0; i < rawCatalog.length; i++) {
      var entry = rawCatalog[i];
      var relFolder = entry.relative_folder;
      var key = pendingKey(relFolder, entry.file_name);
      if (pending.removals[key]) continue; // queued for removal -- hidden until actually deleted
      var editEntry = pending.edits[key];
      var folderName = basename(relFolder);
      var date = resolveDate(entry);
      var sd = entry.subject_description || {};
      var standard = sd.standard || null;
      var monty = sd.monty_python || null;
      var subjectDesc = (entry.subject && entry.subject.description) || null;
      var pendingMove = null;
      if (editEntry) {
        if (editEntry.subject_description) {
          if (editEntry.subject_description.standard != null) standard = editEntry.subject_description.standard;
          if (editEntry.subject_description.monty_python != null) monty = editEntry.subject_description.monty_python;
        }
        if (editEntry.subject && editEntry.subject.description != null) subjectDesc = editEntry.subject.description;
        if (editEntry.move_to_folder && editEntry.move_to_folder !== folderName) pendingMove = editEntry.move_to_folder;
      }
      var item = {
        file_name: entry.file_name,
        origRelativeFolder: relFolder,
        url: buildUrl(relFolder, entry.file_name),
        type: (entry.multimedia_metadata && entry.multimedia_metadata.type) || "photo",
        dtMs: date.ms,
        dtSource: date.source,
        descStandard: standard,
        descMonty: monty,
        subjectDesc: subjectDesc,
        pendingMove: pendingMove,
        raw: entry
      };
      (out[folderName] = out[folderName] || []).push(item);
    }
    return out;
  }

  var DATA = buildGroups(window.MULTIMEDIA_CATALOG || []);

  // Finds a still-present item by its current day folder (the day-picker's
  // own folder key / basename(relative_folder)) and file_name -- used by
  // the Edit/Remove overlay buttons, which only have those two things to
  // go on (see renderDayList()'s data-folder/data-file attributes).
  function findItemInData(folder, fileName) {
    var list = DATA[folder];
    if (!list) return null;
    for (var j = 0; j < list.length; j++) {
      if (list[j].file_name === fileName) return list[j];
    }
    return null;
  }

  var pageTitle = document.getElementById("page-title");
  var backLink = document.querySelector(".back-link");
  var dayNav = document.getElementById("day-nav");
  var allDaysLink = document.getElementById("all-days-link");
  var countEl = document.getElementById("count");
  var sortSel = document.getElementById("sort");

  backLink.href = "journal.html?trip=" + encodeURIComponent(TRIP);
  allDaysLink.href = dailyGalleryUrl({});

  var dayPicker = document.getElementById("day-picker");
  var dayList = document.getElementById("day-list");
  var daySortSel = document.getElementById("day-sort");
  var emptyState = document.getElementById("empty-state");
  var emptyStateMsg = document.getElementById("empty-state-msg");
  var grid = document.getElementById("grid");

  var viewer = document.getElementById("viewer");
  var viewerCount = document.getElementById("viewer-count");
  var viewerCaption = document.getElementById("viewer-caption");
  var viewerClose = document.getElementById("viewer-close");

  var descBlock = document.getElementById("desc-block");
  var descLabelInline = document.getElementById("desc-label-inline");
  var descBody = document.getElementById("desc-body");
  var descToggle = document.getElementById("desc-toggle");

  var stage = document.getElementById("stage");
  var stageImg = document.getElementById("stage-img");
  var stageVideo = document.getElementById("stage-video");
  var zoomBar = document.getElementById("zoom-bar");
  var zoomLevel = document.getElementById("zoom-level");

  var navFirst = document.getElementById("nav-first");
  var navPrev = document.getElementById("nav-prev");
  var navNext = document.getElementById("nav-next");
  var navLast = document.getElementById("nav-last");

  var dataBtn = document.getElementById("data-btn");
  var dataModal = document.getElementById("data-modal");
  var dataJson = document.getElementById("data-json");
  var dataClose = document.getElementById("data-close");
  var nextDayLink = document.getElementById("next-day-link");

  var editModeToggleBtn = document.getElementById("edit-mode-toggle");
  var viewerEditModeToggleBtn = document.getElementById("viewer-edit-mode-toggle");
  var pendingChangesEl = document.getElementById("pending-changes");
  var pendingCountEl = document.getElementById("pending-count");
  var pendingDownloadBtn = document.getElementById("pending-download");
  var pendingClearBtn = document.getElementById("pending-clear");
  var viewerEditControls = document.getElementById("viewer-edit-controls");
  var viewerEditBtn = document.getElementById("viewer-edit-btn");
  var viewerRemoveBtn = document.getElementById("viewer-remove-btn");

  var editModal = document.getElementById("edit-modal");
  var editModalClose = document.getElementById("edit-modal-close");
  var editSubjectInput = document.getElementById("edit-subject-input");
  var editStandardInput = document.getElementById("edit-standard-input");
  var editMontyInput = document.getElementById("edit-monty-input");
  var editDayInput = document.getElementById("edit-day-input");
  var editDayOptions = document.getElementById("edit-day-options");
  var editSaveBtn = document.getElementById("edit-save-btn");
  var editCancelBtn = document.getElementById("edit-cancel-btn");
  var editingItem = null;

  var slideshowIntervalSel = document.getElementById("slideshow-interval");
  var slideshowStartBtn = document.getElementById("slideshow-start");
  var slideshowToggleBtn = document.getElementById("slideshow-toggle");
  var allSlideshowIntervalSel = document.getElementById("all-slideshow-interval");
  var allSlideshowStartBtn = document.getElementById("all-slideshow-start");
  // Third pair of the same controls, in the individual viewer's own zoom
  // bar -- lets a visitor start a slideshow without backing out to the
  // grid first. Same startSlideshow() machinery as the other two.
  var viewerSlideshowIntervalSel = document.getElementById("viewer-slideshow-interval");
  var viewerSlideshowStartBtn = document.getElementById("viewer-slideshow-start");

  var currentFolder = null;
  var items = [];       // current folder (or, for the All-Days slideshow, every folder), sorted
  var sortDir = "asc";
  var daySortDir = "asc"; // All Days list: oldest first by default
  var currentIndex = -1;
  var zoomScale = 1;
  var showingMonty = false;
  var slideshowTimerId = null;
  var slideshowActive = false;
  var slideshowPaused = false;
  var activeSlideshowIntervalSel = slideshowIntervalSel; // whichever dropdown started the current slideshow
  // True while the slideshow is sitting on a video (or, should this data
  // model ever grow one, an audio) item and waiting on stage-video's own
  // "ended"/"error" events instead of a fixed-duration timer -- see
  // scheduleSlideshowStep() below.
  var slideshowVideoWaiting = false;

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  function folderTitle(folder) {
    var m = DATE_RE.exec(folder);
    if (!m) return folder;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12));
    return d.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC"
    });
  }

  // Compact "Jul 11" form of folderTitle(), for the small "Next Day"
  // link in the viewer -- folderTitle()'s full "Friday, July 11, 2026" is
  // too long for that space.
  function shortFolderLabel(folder) {
    var m = DATE_RE.exec(folder);
    if (!m) return folder;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12));
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  }

  function fmtDate(ms) {
    if (ms == null) return "Unknown date";
    var d = new Date(ms);
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
    });
  }

  // Items with no resolvable date always sort last, in either direction.
  function sortItems(list, dir) {
    var arr = list.slice();
    arr.sort(function (a, b) {
      var am = a.dtMs == null ? Infinity : a.dtMs;
      var bm = b.dtMs == null ? Infinity : b.dtMs;
      if (am === bm) return a.file_name.localeCompare(b.file_name, undefined, { numeric: true });
      if (am === Infinity || bm === Infinity) return am - bm;
      return dir === "asc" ? am - bm : bm - am;
    });
    return arr;
  }

  // ---- Day picker (no ?folder= given) -----------------------------------
  // "All Days" is a single vertical list, sorted chronologically by
  // folder/date -- oldest first by default (daySortDir "asc"), switchable
  // to newest first via the day-sort dropdown, same asc/desc convention
  // the per-day thumbnail grid's own sort dropdown already uses.
  function sortFolders(folders, dir) {
    var arr = folders.slice();
    arr.sort(function (a, b) {
      return dir === "asc"
        ? a.localeCompare(b, undefined, { numeric: true })
        : b.localeCompare(a, undefined, { numeric: true });
    });
    return arr;
  }

  // The next day after `folder`, always in chronological order regardless
  // of the grid's own sort dropdown -- same convention renderDayNav()
  // uses. Returns null at the trip's last day, or if `folder` isn't a
  // known day at all.
  function nextFolderAfter(folder) {
    var folders = sortFolders(Object.keys(DATA), "asc");
    var idx = folders.indexOf(folder);
    if (idx === -1 || idx >= folders.length - 1) return null;
    return folders[idx + 1];
  }

  // That day's own first item (oldest-first), matching the order its
  // thumbnail row and its own viewer already open on.
  function firstItemOfFolder(folder) {
    var list = DATA[folder];
    if (!list || !list.length) return null;
    return sortItems(list, "asc")[0];
  }

  // Header-level First/Previous/Next/Last day links, shown to the right of
  // the "Journal" back-link whenever a ?folder= (date) is specified.
  // Always chronological (oldest-first) regardless of the grid's own sort
  // dropdown -- these links are about which day, not which order that
  // day's items are shown in. First/Last always link somewhere (the trip's
  // own ends). Previous/Next always render too, but turn into a disabled,
  // unclickable span (no href) at whichever end of the trip has nothing to
  // go to, rather than disappearing -- so the nav row's layout never
  // shifts as you move through the days.
  function dayNavLink(label, icon, folder) {
    var inner = '<span class="day-nav-icon">' + icon + "</span> " + label;
    if (folder == null) {
      return '<span class="day-nav-link disabled" aria-disabled="true">' + inner + "</span>";
    }
    return '<a class="day-nav-link" href="' + dailyGalleryUrl({ folder: folder }) + '">' + inner + "</a>";
  }
  function renderDayNav(folder) {
    var folders = sortFolders(Object.keys(DATA), "asc");
    if (!folders.length) {
      dayNav.style.display = "none";
      dayNav.innerHTML = "";
      return;
    }
    var idx = folders.indexOf(folder);
    var prevFolder = idx > 0 ? folders[idx - 1] : null;
    var nextFolder = (idx >= 0 && idx < folders.length - 1) ? folders[idx + 1] : null;
    var parts = [];
    parts.push(dayNavLink("First", "&#8676;", folders[0]));
    parts.push(dayNavLink("Previous", "&lsaquo;", prevFolder));
    parts.push(dayNavLink("Next", "&rsaquo;", nextFolder));
    parts.push(dayNavLink("Last", "&#8677;", folders[folders.length - 1]));
    dayNav.innerHTML = parts.join("");
    dayNav.style.display = "flex";
  }

  // Every file across every photos/ subfolder, concatenated day by day in
  // the day-picker's own current day-sort order (so an All-Days slideshow
  // starting from an oldest-first list starts on the trip's first day, and
  // from a newest-first list starts on its most recent), and always
  // oldest-first WITHIN a day -- matching the order that day's own
  // thumbnail row (see renderDayList()) already shows them in.
  function buildAllItems() {
    var folders = sortFolders(Object.keys(DATA), daySortDir);
    var all = [];
    folders.forEach(function (folder) {
      all = all.concat(sortItems(DATA[folder], "asc"));
    });
    return all;
  }

  function renderDayPicker() {
    pageTitle.textContent = "Daily Gallery";
    backLink.style.display = "inline";
    document.querySelector(".header-right").style.display = "none";
    dayNav.style.display = "none";
    dayNav.innerHTML = "";
    grid.style.display = "none";
    emptyState.style.display = "none";
    dayPicker.style.display = "block";
    renderDayList();
  }

  function renderDayList() {
    var folderNames = Object.keys(DATA);

    if (!folderNames.length) {
      dayList.innerHTML = "";
      var p = document.createElement("p");
      p.style.color = "var(--ink-soft)";
      p.style.textAlign = "center";
      p.textContent = "No multimedia files found. Run scripts/python/build-multimedia-data.py, then build-daily-multimedia-gallery.js, again.";
      dayList.appendChild(p);
      return;
    }

    var folders = sortFolders(folderNames, daySortDir);

    dayList.innerHTML = folders.map(function (folder) {
      var dayItems = sortItems(DATA[folder], "asc"); // always oldest-first within a day's thumbnail row
      var count = dayItems.length;
      var dayLink = '<a class="day-card" href="' + dailyGalleryUrl({ folder: folder }) + '">'
        + '<div class="day-card-title">' + esc(folderTitle(folder)) + "</div>"
        + '<div class="day-card-count">' + count + (count === 1 ? " item" : " items") + "</div>"
        + "</a>";
      var thumbsHtml = dayItems.map(function (item) {
        // Each thumbnail links straight to that photo/video via the same
        // ?folder=&photo= deep link daily-location-gallery.html's own
        // thumbnails use -- no separate inline-viewer wiring needed here.
        var thumbHref = dailyGalleryUrl({ folder: folder, photo: item.file_name });
        var mediaHtml = item.type === "video"
          ? '<video muted preload="metadata" src="' + item.url + '"></video><span class="video-badge">&#9654;</span>'
          : '<img loading="lazy" src="' + item.url + '" alt="' + esc(item.file_name) + '">';
        var moveTag = item.pendingMove
          ? '<span class="pending-move-badge">&#8594; ' + esc(item.pendingMove) + '</span>' : '';
        // Built as an HTML string (like the rest of this list), so its
        // Edit/Remove buttons are wired via delegation on #day-list rather
        // than a per-button closure -- see the dayList click listener below.
        var editControls = editMode
          ? '<span class="day-thumb-edit-controls">'
            + '<button type="button" class="thumb-edit-btn edit" data-folder="' + esc(folder) + '" data-file="' + esc(item.file_name) + '" title="Edit">&#9998;</button>'
            + '<button type="button" class="thumb-edit-btn remove" data-folder="' + esc(folder) + '" data-file="' + esc(item.file_name) + '" title="Remove">&#128465;</button>'
            + '</span>'
          : '';
        return '<a class="day-thumb" href="' + thumbHref + '" title="' + esc(item.file_name) + '">' + mediaHtml + editControls + moveTag + "</a>";
      }).join("");
      return '<div class="day-block">' + dayLink + '<div class="day-thumbs">' + thumbsHtml + "</div></div>";
    }).join("");
  }

  // ---- Grid ---------------------------------------------------------------
  function loadFolder(folder) {
    var list = DATA[folder];
    dayPicker.style.display = "none";
    document.querySelector(".header-right").style.display = "flex";
    backLink.style.display = "inline";
    renderDayNav(folder);

    if (!list || !list.length) {
      grid.style.display = "none";
      emptyState.style.display = "flex";
      emptyStateMsg.textContent =
        'No multimedia files recorded for "' + folder + '" in data/multimedia/multimedia-data.json.';
      pageTitle.textContent = "Gallery for " + folderTitle(folder);
      countEl.textContent = "";
      return;
    }

    currentFolder = folder;
    pageTitle.textContent = "Gallery for " + folderTitle(folder);
    emptyState.style.display = "none";
    grid.style.display = "grid";
    sortAndRenderGrid();
  }

  function sortAndRenderGrid() {
    items = sortItems(DATA[currentFolder], sortDir);
    countEl.textContent = items.length + (items.length === 1 ? " item" : " items");
    grid.innerHTML = "";
    items.forEach(function (item, i) {
      var cell = document.createElement("div");
      cell.className = "thumb";
      var dateLabel = item.dtMs == null ? "No date" : fmtDate(item.dtMs);
      var mediaHtml = item.type === "video"
        ? '<video muted preload="metadata" src="' + item.url + '"></video><span class="video-badge">&#9654; video</span>'
        : '<img loading="lazy" src="' + item.url + '" alt="' + esc(item.file_name) + '">';
      var moveTag = item.pendingMove
        ? '<span class="pending-move-badge">&#8594; ' + esc(item.pendingMove) + '</span>' : '';
      cell.innerHTML = mediaHtml
        + '<div class="name">' + esc(item.file_name)
        + '<span class="thumb-date">' + esc(dateLabel) + "</span></div>"
        + moveTag;
      if (editMode) {
        var controls = document.createElement("span");
        controls.className = "thumb-edit-controls";
        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "thumb-edit-btn edit";
        editBtn.title = "Edit";
        editBtn.innerHTML = "&#9998;";
        editBtn.addEventListener("click", function (e) { e.stopPropagation(); openEditModal(item); });
        var removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "thumb-edit-btn remove";
        removeBtn.title = "Remove";
        removeBtn.innerHTML = "&#128465;";
        removeBtn.addEventListener("click", function (e) { e.stopPropagation(); removeItem(item); });
        controls.appendChild(editBtn);
        controls.appendChild(removeBtn);
        cell.appendChild(controls);
      }
      cell.addEventListener("click", function () { openViewer(i); });
      grid.appendChild(cell);
    });
  }

  // ---- Individual viewer ----------------------------------------------
  // Opening a fresh item (a direct thumbnail click, or startSlideshow's
  // own initial call before it arms the timer) always stops any slideshow
  // that might still be running from before.
  function openViewer(i) {
    stopSlideshow();
    currentIndex = i;
    zoomScale = 1;
    showingMonty = false;
    renderViewerItem();
    viewer.classList.add("open");
  }
  function closeViewer() {
    stopSlideshow();
    showingMonty = false; // reset the sticky alternate-description choice
    viewer.classList.remove("open");
    stageVideo.pause();
  }

  function renderViewerItem() {
    var item = items[currentIndex];

    viewerCount.textContent = (currentIndex + 1) + " / " + items.length;
    var dateLabel = item.dtMs == null ? "No date recorded" : fmtDate(item.dtMs);
    if (item.dtSource === "file_modified") dateLabel += " (file date, no EXIF capture time)";
    viewerCaption.textContent = item.file_name + "  \u2014  " + dateLabel;

    // Media
    stage.classList.remove("zoomed");
    stage.scrollTop = 0;
    stage.scrollLeft = 0;
    zoomScale = 1;
    if (item.type === "video") {
      stageImg.style.display = "none";
      stageVideo.style.display = "block";
      stageVideo.src = item.url;
      stageVideo.style.transform = "scale(1)";
      zoomBar.style.display = "none"; // native video controls handle their own zoom/fullscreen
    } else {
      stageVideo.style.display = "none";
      stageVideo.removeAttribute("src");
      stageImg.style.display = "block";
      stageImg.src = item.url;
      stageImg.alt = item.file_name;
      stageImg.style.transform = "scale(1)";
      zoomBar.style.display = "flex";
      zoomLevel.textContent = "100%";
    }

    // Subject description text block (DESCRIPTION / YET ANOTHER DESCRIPTION)
    if (item.descStandard) {
      descBlock.style.display = "block";
      renderDescription();
    } else {
      descBlock.style.display = "none";
    }

    navFirst.disabled = currentIndex === 0;
    navPrev.disabled = currentIndex === 0;
    navNext.disabled = currentIndex === items.length - 1;
    navLast.disabled = currentIndex === items.length - 1;

    // On the last item of a single day's own gallery (currentFolder is
    // only set there -- not during the All-Days slideshow, which already
    // flows into the next day's items on its own), offer a way to jump
    // straight into the next day's first item instead of backing out to
    // the day picker first.
    var nextDayFolder = (currentFolder && currentIndex === items.length - 1)
      ? nextFolderAfter(currentFolder)
      : null;
    var nextDayItem = nextDayFolder ? firstItemOfFolder(nextDayFolder) : null;
    if (nextDayFolder && nextDayItem) {
      nextDayLink.href = dailyGalleryUrl({ folder: nextDayFolder, photo: nextDayItem.file_name });
      nextDayLink.textContent = "Next Day: " + shortFolderLabel(nextDayFolder) + " →";
      nextDayLink.style.display = "inline-flex";
    } else {
      nextDayLink.style.display = "none";
    }
  }

  // Two states for the subject description text block:
  //   standard: "DESCRIPTION " + descStandard + "Show Alternate" link
  //   alternate (Monty Python): "YET ANOTHER DESCRIPTION " + descMonty
  //     + "Show Original" link, with Monty Python styling on the whole block
  function renderDescription() {
    var item = items[currentIndex];
    if (!item.descStandard) return;
    if (showingMonty && item.descMonty) {
      descBlock.className = "desc-block monty";
      descLabelInline.textContent = "YET ANOTHER DESCRIPTION ";
      descBody.textContent = item.descMonty;
      descToggle.textContent = "Show Original";
    } else {
      descBlock.className = "desc-block";
      descLabelInline.textContent = "DESCRIPTION ";
      descBody.textContent = item.descStandard;
      descToggle.textContent = "Show Alternate";
    }
    descToggle.style.display = item.descMonty ? "inline" : "none";
  }

  // Sticky alternate description: navigating between items on purpose
  // does NOT reset showingMonty -- if you have switched to the Monty
  // Python description, it stays selected as you move through the rest
  // of the gallery (gracefully falling back to the standard description
  // for any item that has no monty_python rewrite of its own). It only
  // resets to standard when you close the viewer back to the gallery --
  // see closeViewer().
  function stepTo(index) {
    if (index < 0 || index >= items.length) return;
    currentIndex = index;
    zoomScale = 1;
    renderViewerItem();
  }

  // ---- Zoom (images only) ------------------------------------------------
  // Zooming in enlarges the image past the size of #stage; #stage scrolls
  // (overflow: auto) so every part of the enlarged image stays reachable.
  // Centered flex content cannot be scrolled into on its top/left side in
  // any browser, so #stage switches to top/left anchoring (the ".zoomed"
  // class) once scale climbs past 100%, and back to centered once it is
  // reset to 100% -- see the matching #stage.zoomed rule and img/video
  // transform-origin: 0 0 in the stylesheet above.
  function setZoom(scale) {
    zoomScale = Math.max(0.5, Math.min(4, scale));
    stageImg.style.transform = "scale(" + zoomScale + ")";
    zoomLevel.textContent = Math.round(zoomScale * 100) + "%";
    if (zoomScale > 1) {
      stage.classList.add("zoomed");
    } else {
      stage.classList.remove("zoomed");
      stage.scrollTop = 0;
      stage.scrollLeft = 0;
    }
  }
  function zoomIn() { setZoom(zoomScale + 0.25); }
  function zoomOut() { setZoom(zoomScale - 0.25); }
  function zoomReset() { setZoom(1); }

  // ---- Full file data popup ----------------------------------------------
  function openDataModal() {
    var item = items[currentIndex];
    dataJson.textContent = JSON.stringify(item.raw, null, 2);
    dataModal.classList.add("open");
  }
  function closeDataModal() {
    dataModal.classList.remove("open");
  }

  // ---- Edit Mode: UI state, edit modal, remove, download/clear ---------
  function updateEditModeUI() {
    [editModeToggleBtn, viewerEditModeToggleBtn].forEach(function (btn) {
      if (btn) btn.classList.toggle("active", editMode);
    });
    if (editModeToggleBtn) {
      editModeToggleBtn.innerHTML = editMode ? "&#9998; Edit Mode: On" : "&#9998; Edit Mode";
      editModeToggleBtn.title = editMode
        ? "Hide edit and remove controls on photos/videos"
        : "Show edit and remove controls on photos/videos";
    }
    if (viewerEditModeToggleBtn) {
      viewerEditModeToggleBtn.title = editMode ? "Turn off edit mode" : "Turn on edit mode (edit/remove controls)";
    }
    var editCount = Object.keys(pending.edits).length;
    var removeCount = Object.keys(pending.removals).length;
    if (pendingChangesEl) pendingChangesEl.style.display = (editMode && (editCount || removeCount)) ? "inline-flex" : "none";
    if (pendingCountEl) {
      var parts = [];
      if (editCount) parts.push(editCount + (editCount === 1 ? " edit" : " edits"));
      if (removeCount) parts.push(removeCount + (removeCount === 1 ? " removal" : " removals"));
      pendingCountEl.textContent = "Pending: " + parts.join(", ");
    }
    if (viewerEditControls) viewerEditControls.style.display = editMode ? "inline" : "none";
  }

  function refreshCurrentView() {
    if (viewer.classList.contains("open")) {
      renderViewerItem();
    } else if (currentFolder) {
      sortAndRenderGrid();
    } else {
      renderDayList();
    }
  }

  function setEditMode(on) {
    editMode = on;
    saveEditMode(on);
    updateEditModeUI();
    refreshCurrentView();
  }
  function toggleEditMode() { setEditMode(!editMode); }

  // Queues the removal (keyed by the file's real, never-renamed identity),
  // drops any pending edit for the same file (a removed file has nothing
  // left to edit), and takes it out of the in-memory model right away so
  // every view reflects it immediately -- no reload needed to see it gone.
  function removeItem(item) {
    if (!window.confirm(
      'Remove "' + item.file_name + '" from the gallery?\n\n' +
      "This queues it for deletion -- nothing is deleted on disk until you " +
      "download the pending changes and run build-multimedia-data.py's " +
      "--remove-files on them."
    )) return;
    var key = pendingKey(item.origRelativeFolder, item.file_name);
    delete pending.edits[key];
    pending.removals[key] = { relative_folder: item.origRelativeFolder, file_name: item.file_name };
    savePending();

    var folderName = basename(item.origRelativeFolder);
    var list = DATA[folderName];
    if (list) {
      var idx = list.indexOf(item);
      if (idx >= 0) list.splice(idx, 1);
    }
    updateEditModeUI();

    if (viewer.classList.contains("open")) {
      items = currentFolder ? sortItems(DATA[currentFolder] || [], sortDir) : buildAllItems();
      if (!items.length) { closeViewer(); return; }
      if (currentIndex >= items.length) currentIndex = items.length - 1;
      renderViewerItem();
    } else {
      refreshCurrentView();
    }
  }

  function openEditModal(item) {
    editingItem = item;
    editSubjectInput.value = item.subjectDesc || "";
    editStandardInput.value = item.descStandard || "";
    editMontyInput.value = item.descMonty || "";
    editDayInput.value = item.pendingMove || basename(item.origRelativeFolder);
    editDayOptions.innerHTML = sortFolders(Object.keys(DATA), "asc").map(function (f) {
      return '<option value="' + esc(f) + '">';
    }).join("");
    editModal.classList.add("open");
  }
  function closeEditModal() {
    editModal.classList.remove("open");
    editingItem = null;
  }
  // Text edits are applied to the in-memory item right away (safe -- no
  // physical file needs to move for a description to change). A day-folder
  // reassignment is recorded as a pending move but NOT applied to the
  // item's own grouping/URL, since the file has not actually moved on disk
  // yet -- see the "Edit Mode: local pending-changes queue" comment above
  // buildGroups().
  function saveEditModal() {
    if (!editingItem) return;
    var item = editingItem;
    var dayValue = (editDayInput.value || "").trim();
    var currentDay = basename(item.origRelativeFolder);
    if (dayValue && !DATE_RE.test(dayValue)) {
      window.alert('Day folder must be in YYYY-MM-DD form (e.g. "' + currentDay + '"), or left as-is.');
      return;
    }
    var key = pendingKey(item.origRelativeFolder, item.file_name);
    var update = pending.edits[key] || { relative_folder: item.origRelativeFolder, file_name: item.file_name };
    update.subject = { description: editSubjectInput.value.trim() };
    update.subject_description = {
      standard: editStandardInput.value.trim(),
      monty_python: editMontyInput.value.trim()
    };
    if (dayValue && dayValue !== currentDay) {
      update.move_to_folder = dayValue;
    } else {
      delete update.move_to_folder;
    }
    pending.edits[key] = update;
    savePending();

    item.subjectDesc = update.subject.description || null;
    item.descStandard = update.subject_description.standard || null;
    item.descMonty = update.subject_description.monty_python || null;
    item.pendingMove = update.move_to_folder || null;

    closeEditModal();
    updateEditModeUI();
    refreshCurrentView();
  }

  function downloadPendingChanges() {
    var payload = {
      generatedAt: new Date().toISOString(),
      trip: TRIP,
      edits: Object.keys(pending.edits).map(function (k) { return pending.edits[k]; }),
      removals: Object.keys(pending.removals).map(function (k) { return pending.removals[k]; })
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "daily-gallery-pending-changes" + (TRIP ? "-" + TRIP : "") + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function clearPendingChanges() {
    if (!window.confirm(
      "Discard every queued edit and removal?\n\n" +
      "This only clears what's staged in this browser -- it does not undo " +
      "anything already applied on disk."
    )) return;
    pending = { edits: {}, removals: {} };
    savePending();
    window.location.reload();
  }

  // ---- Slideshow ------------------------------------------------------------
  // Opens the individual multimedia display at the first item of the
  // current (sorted) grid and auto-advances through every item, looping
  // back to the first after the last, every N seconds (default 4,
  // selectable via the header dropdown before starting). Manual
  // navigation while a slideshow is running does not stop it -- only the
  // pause/resume button in the left panel, or closing the viewer, does.
  //
  // intervalSel picks which "Slideshow: Ns" dropdown to read the duration
  // from -- the header one (per-day grid) by default, or the day-picker's
  // own copy when called from startAllDaysSlideshow() below. Same rule as
  // always: only read once, at the moment the slideshow starts.
  function startSlideshow(intervalSel) {
    if (!items.length) return;
    activeSlideshowIntervalSel = intervalSel || slideshowIntervalSel;
    openViewer(0);
    slideshowActive = true;
    slideshowPaused = false;
    slideshowToggleBtn.style.display = "flex";
    updateSlideshowToggleUI();
    scheduleSlideshowStep();
  }
  // Concatenates every day's items (buildAllItems()) into `items` and
  // starts the same slideshow machinery on that combined list -- so it
  // plays through every photo/video in every photos/ subfolder, one
  // continuous slideshow, without leaving the "All Days" screen first.
  function startAllDaysSlideshow() {
    currentFolder = null;
    items = buildAllItems();
    startSlideshow(allSlideshowIntervalSel);
  }
  function startSlideshowTimer() {
    clearSlideshowTimer();
    var seconds = parseInt(activeSlideshowIntervalSel.value, 10) || 4;
    slideshowTimerId = window.setTimeout(advanceSlideshowStep, seconds * 1000);
  }
  function clearSlideshowTimer() {
    if (slideshowTimerId !== null) {
      window.clearTimeout(slideshowTimerId);
      slideshowTimerId = null;
    }
  }
  // Decides how the slideshow should sit on whatever item is now on
  // screen: a fixed-duration timer for a photo (unchanged from before),
  // or -- for a video/audio item -- no timer at all, waiting instead on
  // that item's own playback to actually finish. Called once right after
  // each item is rendered (from startSlideshow and advanceSlideshowStep),
  // and again on resume from pause.
  function scheduleSlideshowStep() {
    clearSlideshowTimer();
    clearSlideshowVideoWait();
    if (!slideshowActive || slideshowPaused) return;
    var item = items[currentIndex];
    if (item && (item.type === "video" || item.type === "audio")) {
      beginSlideshowVideoWait();
    } else {
      startSlideshowTimer();
    }
  }
  // Loads (renderViewerItem already pointed stage-video at item.url),
  // plays, and waits for stage-video's own "ended" event before letting
  // the slideshow move on -- so a video/audio slide gets exactly as long
  // as it actually runs, not a guess from the photo interval dropdown.
  // "error" is handled the same way "ended" is (advance rather than
  // stall forever) so one broken/missing file can't freeze the slideshow.
  function beginSlideshowVideoWait() {
    slideshowVideoWaiting = true;
    stageVideo.addEventListener("ended", onSlideshowVideoEnded);
    stageVideo.addEventListener("error", onSlideshowVideoError);
    var playPromise = stageVideo.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(function () {
        // Autoplay was blocked (e.g. the browser hasn't credited this
        // page with enough prior user interaction for sound-on
        // autoplay) -- don't leave the slideshow waiting on a video that
        // will never start; fall back to giving it the normal photo
        // interval instead, same as any other slide.
        clearSlideshowVideoWait();
        startSlideshowTimer();
      });
    }
  }
  function clearSlideshowVideoWait() {
    if (!slideshowVideoWaiting) return;
    stageVideo.removeEventListener("ended", onSlideshowVideoEnded);
    stageVideo.removeEventListener("error", onSlideshowVideoError);
    slideshowVideoWaiting = false;
  }
  function onSlideshowVideoEnded() {
    clearSlideshowVideoWait();
    advanceSlideshowStep();
  }
  function onSlideshowVideoError() {
    clearSlideshowVideoWait();
    advanceSlideshowStep();
  }
  // Stops at the last item instead of looping back to the first: once the
  // last item has had its own full interval on screen, the next tick
  // stops the slideshow (leaving that last item displayed) rather than
  // wrapping around to item 0 again.
  function advanceSlideshowStep() {
    if (currentIndex >= items.length - 1) {
      stopSlideshow();
      return;
    }
    currentIndex = currentIndex + 1;
    zoomScale = 1;
    renderViewerItem();
    scheduleSlideshowStep();
  }
  function toggleSlideshowPause() {
    if (!slideshowActive) return;
    slideshowPaused = !slideshowPaused;
    if (slideshowPaused) {
      clearSlideshowTimer();
      if (slideshowVideoWaiting) stageVideo.pause();
    } else if (slideshowVideoWaiting) {
      var playPromise = stageVideo.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function () {
          clearSlideshowVideoWait();
          startSlideshowTimer();
        });
      }
    } else {
      startSlideshowTimer();
    }
    updateSlideshowToggleUI();
  }
  function updateSlideshowToggleUI() {
    if (slideshowPaused) {
      slideshowToggleBtn.innerHTML = "&#9654;";
      slideshowToggleBtn.title = "Resume slideshow";
    } else {
      slideshowToggleBtn.innerHTML = "&#9208;";
      slideshowToggleBtn.title = "Pause slideshow";
    }
  }
  // stopSlideshow is called from openViewer/closeViewer too, so it is
  // always safe to call even when no slideshow is running.
  function stopSlideshow() {
    clearSlideshowTimer();
    clearSlideshowVideoWait();
    slideshowActive = false;
    slideshowPaused = false;
    slideshowToggleBtn.style.display = "none";
  }

  // ---- Wire up events -----------------------------------------------------
  sortSel.addEventListener("change", function () {
    sortDir = sortSel.value;
    if (currentFolder) sortAndRenderGrid();
  });

  daySortSel.addEventListener("change", function () {
    daySortDir = daySortSel.value;
    renderDayList();
  });

  slideshowStartBtn.addEventListener("click", function () { startSlideshow(slideshowIntervalSel); });
  slideshowToggleBtn.addEventListener("click", toggleSlideshowPause);
  allSlideshowStartBtn.addEventListener("click", startAllDaysSlideshow);
  viewerSlideshowStartBtn.addEventListener("click", function () { startSlideshow(viewerSlideshowIntervalSel); });

  viewerClose.addEventListener("click", closeViewer);
  viewer.addEventListener("click", function (e) { if (e.target === viewer) closeViewer(); });

  navFirst.addEventListener("click", function () { stepTo(0); });
  navPrev.addEventListener("click", function () { stepTo(currentIndex - 1); });
  navNext.addEventListener("click", function () { stepTo(currentIndex + 1); });
  navLast.addEventListener("click", function () { stepTo(items.length - 1); });

  descToggle.addEventListener("click", function (e) {
    e.preventDefault();
    showingMonty = !showingMonty;
    renderDescription();
  });

  document.getElementById("zoom-in").addEventListener("click", zoomIn);
  document.getElementById("zoom-out").addEventListener("click", zoomOut);
  document.getElementById("zoom-reset").addEventListener("click", zoomReset);

  dataBtn.addEventListener("click", function (e) { e.preventDefault(); openDataModal(); });
  dataClose.addEventListener("click", closeDataModal);
  dataModal.addEventListener("click", function (e) { if (e.target === dataModal) closeDataModal(); });

  editModeToggleBtn.addEventListener("click", toggleEditMode);
  if (viewerEditModeToggleBtn) viewerEditModeToggleBtn.addEventListener("click", toggleEditMode);
  pendingDownloadBtn.addEventListener("click", downloadPendingChanges);
  pendingClearBtn.addEventListener("click", clearPendingChanges);

  editModalClose.addEventListener("click", closeEditModal);
  editCancelBtn.addEventListener("click", closeEditModal);
  editModal.addEventListener("click", function (e) { if (e.target === editModal) closeEditModal(); });
  editSaveBtn.addEventListener("click", saveEditModal);

  viewerEditBtn.addEventListener("click", function (e) {
    e.preventDefault();
    if (currentIndex >= 0 && items[currentIndex]) openEditModal(items[currentIndex]);
  });
  viewerRemoveBtn.addEventListener("click", function (e) {
    e.preventDefault();
    if (currentIndex >= 0 && items[currentIndex]) removeItem(items[currentIndex]);
  });

  // Day picker thumbnails are plain HTML strings (see renderDayList()), so
  // their Edit/Remove buttons are wired via delegation on the shared list
  // container instead of a per-button closure -- the grid's own thumbnails
  // (sortAndRenderGrid()) are built as real DOM nodes and wire their
  // buttons directly, since a closure over `item` is available there.
  dayList.addEventListener("click", function (e) {
    var btn = e.target.closest(".thumb-edit-btn");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var folder = btn.getAttribute("data-folder");
    var file = btn.getAttribute("data-file");
    var item = findItemInData(folder, file);
    if (!item) return;
    if (btn.classList.contains("remove")) removeItem(item);
    else openEditModal(item);
  });

  document.addEventListener("keydown", function (e) {
    if ((e.key === "f" || e.key === "F") && FULLSCREEN_SUPPORTED) {
      var active = document.activeElement;
      var tag = active && active.tagName;
      if (tag !== "SELECT" && tag !== "INPUT" && tag !== "TEXTAREA") {
        toggleFullscreen();
        return;
      }
    }
    if (editModal.classList.contains("open")) {
      if (e.key === "Escape") closeEditModal();
      return;
    }
    if (dataModal.classList.contains("open")) {
      if (e.key === "Escape") closeDataModal();
      return;
    }
    if (!viewer.classList.contains("open")) return;
    if (e.key === "ArrowLeft") stepTo(currentIndex - 1);
    else if (e.key === "ArrowRight") stepTo(currentIndex + 1);
    else if (e.key === "Home") stepTo(0);
    else if (e.key === "End") stepTo(items.length - 1);
    else if (e.key === "Escape") closeViewer();
    else if (e.key === "+" || e.key === "=") zoomIn();
    else if (e.key === "-" || e.key === "_") zoomOut();
    else if (e.key === "0") zoomReset();
  });

  // ---- Fullscreen -----------------------------------------------------------
  // TRUE browser fullscreen (the Fullscreen API), not to be confused with
  // the #viewer overlay above, which already fills the browser's own
  // viewport but leaves its address bar/tabs visible. One shared toggle
  // backs two entry points -- the header button (visible in both the day
  // picker and the per-day grid, since <header> sits outside both) and the
  // viewer's own button -- since document.fullscreenElement is a single,
  // page-wide bit of state: entering or leaving fullscreen from either
  // button, or via the browser's own native handling (Escape, F11), updates
  // both buttons together through the fullscreenchange listener below.
  // Whichever element fullscreens is document.documentElement (the whole
  // page), not just #viewer -- so the day picker/grid can go fullscreen on
  // their own too, without a photo open.
  var fullscreenBtn = document.getElementById("fullscreen-toggle");
  var viewerFullscreenBtn = document.getElementById("viewer-fullscreen-toggle");
  var viewerFullscreenTextBtn = document.getElementById("viewer-fullscreen-btn");
  var docEl = document.documentElement;
  var FULLSCREEN_SUPPORTED = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function enterFullscreen() {
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (!req) return;
    // Older Safari's webkitRequestFullscreen has no Promise return value --
    // guard the .catch() so a rejected/undefined result never throws here.
    var result = req.call(docEl);
    if (result && result.catch) result.catch(function (err) { console.warn("Fullscreen request failed:", err); });
  }
  function leaveFullscreen() {
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
  function toggleFullscreen() {
    if (isFullscreen()) leaveFullscreen(); else enterFullscreen();
  }
  function updateFullscreenButtons() {
    var active = isFullscreen();
    if (fullscreenBtn) {
      fullscreenBtn.innerHTML = active ? "&#9974; Exit Fullscreen" : "&#9974; Fullscreen";
      fullscreenBtn.title = active ? "Exit fullscreen (F)" : "Enter fullscreen (F)";
    }
    if (viewerFullscreenBtn) {
      viewerFullscreenBtn.title = active ? "Exit fullscreen (F)" : "Enter fullscreen (F)";
    }
    if (viewerFullscreenTextBtn) {
      viewerFullscreenTextBtn.innerHTML = active ? "&#9974; Exit Full Screen" : "&#9974; Full Screen";
      viewerFullscreenTextBtn.title = active ? "Exit fullscreen (F)" : "Enter fullscreen (F)";
    }
  }
  if (!FULLSCREEN_SUPPORTED) {
    // No known browser lacks this today, but if one ever does, hide both
    // buttons rather than leave a click that silently does nothing --
    // same treatment Read Aloud gets elsewhere in this project when
    // speechSynthesis is unavailable.
    if (fullscreenBtn) fullscreenBtn.style.display = "none";
    if (viewerFullscreenBtn) viewerFullscreenBtn.style.display = "none";
    if (viewerFullscreenTextBtn) viewerFullscreenTextBtn.style.display = "none";
  } else {
    if (fullscreenBtn) fullscreenBtn.addEventListener("click", toggleFullscreen);
    if (viewerFullscreenBtn) viewerFullscreenBtn.addEventListener("click", toggleFullscreen);
    if (viewerFullscreenTextBtn) viewerFullscreenTextBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButtons);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButtons);
    updateFullscreenButtons(); // sync labels in case the page loaded already fullscreen (e.g. a reload)
  }

  updateEditModeUI(); // sync toggle/pending UI with whatever loadEditMode()/loadPending() found in localStorage

  // ---- Entry point ---------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var folderParam = params.get("folder");
  var photoParam = params.get("photo");
  if (folderParam) {
    loadFolder(folderParam);
    // ?photo=<file_name> (e.g. from daily-location-gallery.html's
    // thumbnail links) opens straight to that item in the viewer instead
    // of leaving the visitor on the plain thumbnail grid. Matched by
    // exact file_name against the just-loaded, just-sorted items list --
    // silently falls back to the grid if the name is not found (renamed
    // file, stale link, etc.) rather than erroring.
    if (photoParam) {
      var photoIdx = items.findIndex(function (it) { return it.file_name === photoParam; });
      if (photoIdx >= 0) openViewer(photoIdx);
    }
  } else {
    renderDayPicker();
  }
})();
</script>

</body>
</html>
